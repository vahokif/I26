name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # the library, CLI, server and test projects need no Godot and no game install
      - run: dotnet test tests/I76.Sim.Tests
      - run: dotnet test tests/I76.Net.Tests
      - run: dotnet test tests/I76.Formats.Tests
      - run: dotnet test tests/I76.Editor.Tests
      # the game project builds without a Godot install (Godot.NET.Sdk comes from NuGet)
      - run: dotnet build game/I76.Game.csproj
      - run: dotnet test tests/I76.Game.Tests
